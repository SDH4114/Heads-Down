<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title data-i18n="blockedTitle">Blocked · Focus Guard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="blocked-page" data-state="focus">
<header class="blocked-top">
  <span class="brand"><span class="brand-mark" aria-hidden="true"></span><span data-i18n="extName">Focus Guard</span></span>
</header>
<main class="blocked-main">
  <span id="reason-pill" class="pill" data-state="on"></span>
  <h1 id="title" class="blocked-title"></h1>
  <p class="blocked-reason"><span id="host" class="host"></span> <span id="reason"></span></p>

  <div id="timer-line" class="countdown-block hidden">
    <span id="timer-label" class="countdown-label"></span>
    <span id="timer" class="countdown countdown--xl" role="timer"></span>
  </div>

  <div class="actions">
    <button id="open" class="primary lg hidden" data-i18n="btnOpenSite">Open site</button>
    <button id="back" class="primary lg" data-i18n="btnGoBack">Go back</button>
    <button id="close" class="lg" data-i18n="btnCloseTab">Close tab</button>
  </div>
  <button id="options" class="ghost sm" data-i18n="btnSettings">Settings</button>
  <p id="announce" class="sr-only" role="status" aria-live="polite"></p>
</main>
<script src="../src/i18n.js"></script>
<script src="common.js"></script>
<script src="blocked.js"></script>
</body>
</html>
